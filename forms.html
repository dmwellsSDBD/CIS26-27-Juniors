<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom PC Build Request</title>
</head>
<body>
  <h1>Custom PC Build Request</h1>
  <p>Fill out this form and our build team will spec out your dream PC.</p>
  <p><a href="index.html">Back to home</a></p>

  <!-- ==========================================================
       PART 1 (zyBooks 3.2 Forms)
       1. Add a <form> with action="https://httpbin.org/get" and target="_blank"
          (no method yet -- what is the default?)
       2. Inside it: labeled text boxes for first name (name/id "first")
          and last name (name/id "last"), each with a placeholder
       3. A <textarea> named "notes" with 5 rows and 50 cols
       4. An <input type="submit">
       5. Test it, read the URL. Then change to method="POST" and
          action="https://httpbin.org/post" and test again.
       ========================================================== -->

   <form action="#" method="GET">
      <fieldset>
         <legend>Your Info</legend>
            <p>
               <label for="first">First Name:</label>
               <input type="text" name="first" id="first" placeholder="Enter your first name" required>
               <!-- NOTE: Input elements are VOID elements - so they do not include a closing tag -->
            </p>
            <p>
               <label for="last">Last Name:</label>
               <input type="text" name="last" id="last" placeholder="Enter your last name" required>
            </p>
            <p>
               <label for="email">Email:</label>
               <input type="email" name="email" id="email" placeholder="name@domain.com" required>
            </p>
            <p>
               <label for="phone">Phone:</label>
               <input type="tel" name="phone" id="phone" placeholder="315-555-1234"
                  pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Format: 315-555-1234">
            </p>
            <p>
               <label for="tracker">Order tracking password (8-12 characters):</label>
               <input type="password" name="tracker" id="tracker" size="12"
                  minlength="8" maxlength="12" required>
            </p>
         </fieldset>

         <fieldset>
            <legend>Processor (pick one)</legend>
            <div>
               <input type="radio" name="cpu" value="i5" id="i5" checked>
               <label for="i5">Intel Core i5</label>
            </div>
            <div>
               <input type="radio" name="cpu" id="i7" value="i7">
               <label for="i7">Intel Core i7</label>
            </div>
            <div>
               <input type="radio" name="cpu" id="atom" value="atom">
               <label for="atom">Intel Atom</label>
            </div>
            <div>
               <input type="radio" name="cpu" id="ryzen5" value="ryzen5">
               <label for="ryzen5">AMD Ryzen 5</label>
            </div>
            <div>
               <input type="radio" name="cpu" id="ryzen7" value="ryzen7">
               <label for="ryzen7">AMD Ryzen 7</label>
            </div>
         </fieldset>

         <!-- checkboxes -->
         <fieldset>
            <legend>Extras (check all that apply)</legend>
            <div>
               <input type="checkbox" name="wifi" id="wifi" checked>
               <label for="wifi">Wi-Fi Card</label>
            </div>
            <div>
               <input type="checkbox" name="rgb" id="rgb">
               <label for="rgb">RGB Lighting</label>
            </div>
            <div>
               <input type="checkbox" name="extraSsd" id="extraSsd">
               <label for="extraSsd">Second SSD</label>
            </div>
         </fieldset>

      <!-- drop-down and list box -->
      <fieldset>
         <legend>Software and Ports</legend>
         <p>
            <label for="os">Operating System</label>
            <select name="os" id="os">
               <option value="win11">Windows 11</option>
               <option value="ubuntu">Linux (Ubuntu)</option>
               <option value="none">No operating system</option>
            </select>
         </p>
         <p>
            <label for="ports">Ports needed (hold Ctrl or Command to pick more than one):</label><br>
            <select name="ports" id="ports" size="4" multiple>
               <option value="usbc">USB-C</option>
               <option value="hdmi">HDMI</option>
               <option value="displayport">Display Port</option>
               <option value="ethernet">Ethernet</option>
               <option value="thunderbolt">Thunderbolt</option>
            </select>
         </p>
      </fieldset>

      <!-- ===== PART 3 (3.4) input pickers, number, range, combo box, url ===== -->
      <fieldset>
         <legend>Build Details</legend>
         <p>
            <label for="budget">Budget in dollars (500-3000):</label>
            <input type="number" name="budget" id="budget" min="500" max="3000" step="50" value="1000">
         </p>
         <p>
            <label for="rgbLevel">RGB brightness (0-100):</label>
            <input type="range" name="rgbLevel" id="rgbLevel" min="0" max="100" step="10" value="50">
         </p>
         <p>
            <label for="caseColor">Case color:</label>
            <input type="color" name="caseColor" id="caseColor" value="#4268d3">
         </p>
         <p>
            <label for="neededBy">Needed by:</label>
            <input type="date" name="neededBy" id="neededBy" min="2026-11-10" max="2027-06-30">
         </p>
         <p>
            <label for="game">Main game or app you'll run:</label>
            <input list="games" name="game" id="game">
            <datalist id="games">
               <option value="Minecraft"></option>
               <option value="Fortnite"></option>
               <option value="Rocket League"></option>
               <option value="Valorant"></option>
               <option value="Visual Studio Code"></option>
            </datalist>
         </p>
         <p>
            <label for="portfolio">Your GitHub Pages site:</label>
            <input type="url" name="portfolio" id="portfolio" placeholder="https://username.github.io">
         </p>
      </fieldset>

      <p>
         <label for="notes">Anything else the build team should know?</label><br>
         <textarea name="notes" id="notes" row="5" cols="50" placeholder="Example: needs to be quiet, must fit under my desk..."></textarea>
      </p>

      <p>
         <button type="submit">Submit Build Request</button>
         <input type="button" value="Save for Later">
      </p>
   </form>



  <!-- ==========================================================
       PART 2 (zyBooks 3.3 Common form widgets)  -- inside the form
       1. Wrap first/last name in <fieldset> with <legend>Your Info</legend>
       2. Add a password field (name/id "tracker", size 12, maxlength 12)
       3. Processor fieldset: 4 radio buttons, name="cpu"
          (i5, i7, ryzen5, ryzen7) -- make i5 checked
       4. Extras fieldset: checkboxes "wifi" (checked), "rgb", "extraSsd"
       5. A <select> drop-down "os": Windows 11, Linux (Ubuntu), No OS
       6. A list box "ports" with size="4" and multiple
       7. Replace the submit input with <button type="submit">
          and add <input type="button" value="Save for Later">
       ========================================================== -->



  <!-- ==========================================================
       PART 3 (zyBooks 3.4 Additional form widgets)  -- inside the form
       1. Email (type="email") and phone (type="tel") in Your Info
       2. Build Details fieldset:
            number  "budget"   min 500, max 3000, step 50
            range   "rgbLevel" min 0, max 100, step 10, value 50
            color   "caseColor"
            date    "neededBy" with a min and max date
            combo box: <input list="games"> + <datalist id="games">
            url     "portfolio"
       3. Validation: add required to first, last, email, tracker;
          minlength="8" on tracker; a pattern on phone
       4. Try to BREAK your form -- submit it empty, type bad data
       ========================================================== -->

</body>
</html>
